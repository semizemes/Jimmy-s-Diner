<html>
  <head>
    <link rel="stylesheet" href="index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Smythe&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <h1>Jimmy’s Diner</h1>
      <p class="header-text">The best burgers and pizzas in town.</p>
    </header>

    <main id="menu"></main>

    <section class="order-section" id="order-section">
      <h2 class="your-order">Your order</h2>
      <ul class="ordered" id="ordered">
        <li class="order-list pizza" id="pizza">
          <span class="chosen-order-name">Pizza</span>
          <span id="pizza-count-span">x 1</span>
          <button class="remove-btn" data-remove="order0">remove</button>
          <span class="chosen-order-price">$14</span>
        </li>
        <li class="order-list hamburger" id="hamburger">
          <span class="chosen-order-name">Hamburger</span>
          <span id="hamburger-count-span">x 1</span>
          <button class="remove-btn" data-remove="order1">remove</button>
          <span class="chosen-order-price">$12</span>
        </li>
        <li class="order-list beer" id="beer">
          <span class="chosen-order-name">Beer</span>
          <span id="beer-count-span">x 1</span>
          <button class="remove-btn" data-remove="order2">remove</button>
          <span class="chosen-order-price" >$12</span>
        </li>
      </ul>
      <p class="total" id="total">
        <span class="total-price-txt">Total Price:</span>
        <span class="total-price">$26</span>
      </p>
      <button class="order-btn">Complete order</button>
    </section>

    <section class="payment">
      <p>Enter card details</p>
      <form action="">
        <input type="text" placeholder="Enter your name" />
        <input type="number" placeholder="Enter card number" />
        <input type="number" placeholder="Enter CVV" />
        <button type="button">Pay</button>
      </form>
    </section>

    <script src="index.js" type="module"></script>
  </body>
</html>
